    // Orden exacto de las 7 asignaturas solicitado para la Home y barra de navegación
    const SUBJECT_ORDER = ["SFE", "PCE", "Didáctica", "BICE", "TICS", "ADA", "Programación"];

    /**
     * GENERADOR DEL CUESTIONARIO GLOBAL DE CADA ASIGNATURA
     * Combina preguntas de los 6 temas de la asignatura de forma equilibrada.
     */
    function getGlobalQuestionsForSubject(subjectId) {
      const subject = SUBJECTS_DB[subjectId];
      if (!subject) return [];

      const combined = [];
      subject.themes.forEach((theme) => {
        // En SFE tomamos una selección equilibrada de todos los temas (incluyendo varias del Tema 2) para un global completo
        const limit = subjectId === "SFE" ? (theme.number === 2 ? 10 : 3) : 3;
        const slice = theme.questions.slice(0, limit);
        slice.forEach((q) => {
          combined.push({
            ...q,
            themeLabel: `Tema ${theme.number}`
          });
        });
      });

      return combined.map((q, index) => ({
        ...q,
        num: index + 1
      }));
    }

    /**
     * ESTADO GLOBAL DE LA APLICACIÓN SPA
     */
    const state = {
      view: "home",              // 'home' | 'subject' | 'quiz'
      subjectId: "SFE",          // Asignatura activa
      selectedThemeId: "tema-1", // Tema seleccionado en el desplegable de la asignatura
      quizKey: "tema-2",         // 'tema-1'..'tema-6' | 'global'
      quizPhase: "setup",        // 'setup' | 'active' | 'results'
      mode: "study",             // 'study' | 'exam'
      shuffle: false,            // Barajar orden de preguntas (desactivado por defecto)
      isFailedRetry: false,      // Si se están repasando solo falladas
      activeQuestions: [],       // Preguntas de la sesión actual
      currentIndex: 0,           // Índice actual en el cuestionario
      userAnswers: {},           // { [questionId]: 'A' | 'B' | 'C' | 'D' }
      reviewFilter: "all",       // 'all' | 'failed'
      mobileMenuOpen: false,     // Menú móvil de la barra superior
      mobileQuizNavOpen: false   // Mapa de preguntas desplegable en móvil
    };

    /**
     * UTILIDADES GENERALES
     */
    function escapeHTML(str) {
      const div = document.createElement("div");
      div.textContent = str;
      return div.innerHTML;
    }

    function shuffleArray(array) {
      const copy = [...array];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    /**
     * MODAL PERSONALIZADO DE CONFIRMACIÓN
     */
    function showConfirmModal({ title, message, confirmText = "Confirmar", cancelText = "Cancelar", variant = "warning", onConfirm }) {
      const modal = document.getElementById("custom-modal");
      const titleEl = document.getElementById("modal-title");
      const messageEl = document.getElementById("modal-message");
      const confirmBtn = document.getElementById("modal-confirm-btn");
      const cancelBtn = document.getElementById("modal-cancel-btn");
      const iconContainer = document.getElementById("modal-icon-container");

      titleEl.textContent = title;
      messageEl.textContent = message;
      confirmBtn.textContent = confirmText;
      cancelBtn.textContent = cancelText;

      if (variant === "danger") {
        iconContainer.className = "w-10 h-10 rounded-xl bg-rose-100 text-rose-600 flex items-center justify-center shrink-0 mt-0.5";
        confirmBtn.className = "w-full sm:w-auto px-4 py-2.5 rounded-xl bg-rose-600 text-white font-semibold text-sm hover:bg-rose-700 transition cursor-pointer";
      } else {
        iconContainer.className = "w-10 h-10 rounded-xl bg-amber-100 text-amber-700 flex items-center justify-center shrink-0 mt-0.5";
        confirmBtn.className = "w-full sm:w-auto px-4 py-2.5 rounded-xl bg-blue-600 text-white font-semibold text-sm hover:bg-blue-700 transition cursor-pointer";
      }

      const closeModal = () => {
        modal.classList.add("hidden");
        modal.classList.remove("flex");
      };

      cancelBtn.onclick = closeModal;
      modal.onclick = (e) => {
        if (e.target === modal) closeModal();
      };
      confirmBtn.onclick = () => {
        closeModal();
        if (typeof onConfirm === "function") onConfirm();
      };

      modal.classList.remove("hidden");
      modal.classList.add("flex");
    }

    /**
     * NAVEGACIÓN CON WINDOW.LOCATION.HASH (SOPORTE ATRÁS / ADELANTE)
     */
    let isInternalHashChange = false;

    function navigateToHash(newHash, skipConfirm = false) {
      const hasInProgressQuiz =
        state.view === "quiz" &&
        state.quizPhase === "active" &&
        Object.keys(state.userAnswers).length > 0;

      if (hasInProgressQuiz && !skipConfirm) {
        showConfirmModal({
          title: "¿Salir del cuestionario en curso?",
          message: "Tienes preguntas respondidas en esta sesión. Si sales ahora, se perderá tu progreso actual.",
          confirmText: "Sí, salir",
          cancelText: "Continuar cuestionario",
          variant: "danger",
          onConfirm: () => {
            isInternalHashChange = true;
            window.location.hash = newHash;
            applyHashRoute(newHash);
          }
        });
        return;
      }

      isInternalHashChange = true;
      if (window.location.hash === newHash) {
        applyHashRoute(newHash);
      } else {
        window.location.hash = newHash;
        applyHashRoute(newHash);
      }
    }

    function applyHashRoute(rawHash) {
      const clean = (rawHash || "").replace(/^#\/?/, "").trim();
      state.mobileMenuOpen = false;
      state.mobileQuizNavOpen = false;

      if (!clean || clean === "home") {
        state.view = "home";
        render();
        window.scrollTo({ top: 0, behavior: "smooth" });
        return;
      }

      const parts = clean.split("/").map((p) => decodeURIComponent(p));

      if (parts[0] === "asignatura" && parts[1] && SUBJECTS_DB[parts[1]]) {
        const subjId = parts[1];
        if (state.subjectId !== subjId) {
          state.subjectId = subjId;
          // Por defecto en SFE preseleccionamos el Tema 2 (20 preguntas), y en el resto el Tema 1
          state.selectedThemeId = subjId === "SFE" ? "tema-2" : "tema-1";
        }
        state.view = "subject";
        render();
        window.scrollTo({ top: 0, behavior: "smooth" });
        return;
      }

      if (parts[0] === "cuestionario" && parts[1] && SUBJECTS_DB[parts[1]]) {
        const subjId = parts[1];
        const quizKey = parts[2] || "global";
        const subj = SUBJECTS_DB[subjId];
        const validTheme = quizKey === "global" || subj.themes.some((t) => t.id === quizKey);

        state.subjectId = subjId;
        state.quizKey = validTheme ? quizKey : "global";
        if (state.quizKey !== "global") {
          state.selectedThemeId = state.quizKey;
        }
        state.view = "quiz";
        state.quizPhase = "setup";
        state.userAnswers = {};
        state.isFailedRetry = false;
        state.reviewFilter = "all";
        render();
        window.scrollTo({ top: 0, behavior: "smooth" });
        return;
      }

      // Ruta desconocida -> volver a Home
      state.view = "home";
      render();
    }

    window.addEventListener("hashchange", () => {
      if (isInternalHashChange) {
        isInternalHashChange = false;
        return;
      }
      applyHashRoute(window.location.hash);
    });

    /**
     * ACCIONES DE INTERACCIÓN EN LAS VISTAS
     */
    function goHome() {
      navigateToHash("#/");
    }

    function goSubject(subjectId) {
      navigateToHash(`#/asignatura/${encodeURIComponent(subjectId)}`);
    }

    function handleThemeDropdownChange(value) {
      state.selectedThemeId = value;
    }

    function openSelectedThemeQuiz() {
      const themeId = state.selectedThemeId || "tema-1";
      navigateToHash(`#/cuestionario/${encodeURIComponent(state.subjectId)}/${encodeURIComponent(themeId)}`);
    }

    function openGlobalQuiz() {
      navigateToHash(`#/cuestionario/${encodeURIComponent(state.subjectId)}/global`);
    }

    function toggleMobileMenu() {
      state.mobileMenuOpen = !state.mobileMenuOpen;
      render();
    }

    function getQuizContextInfo() {
      const subject = SUBJECTS_DB[state.subjectId];
      if (!subject) return { subject: null, title: "", questions: [] };

      if (state.quizKey === "global") {
        return {
          subject,
          title: `Cuestionario Global · ${subject.code}`,
          subtitle: "Preguntas combinadas de los 6 temas de la asignatura",
          questions: getGlobalQuestionsForSubject(subject.id)
        };
      }

      const theme = subject.themes.find((t) => t.id === state.quizKey) || subject.themes[0];
      return {
        subject,
        title: theme.title,
        subtitle: `${subject.code} — ${subject.name}`,
        questions: theme.questions
      };
    }

    function selectQuizMode(mode) {
      state.mode = mode;
      render();
    }

    function toggleQuizShuffle(checked) {
      state.shuffle = checked;
    }

    function startActiveQuiz(customQuestions = null, isFailedRetry = false) {
      const info = getQuizContextInfo();
      const baseQuestions = customQuestions ? [...customQuestions] : [...info.questions];
      state.activeQuestions = state.shuffle && !isFailedRetry ? shuffleArray(baseQuestions) : baseQuestions;
      state.currentIndex = 0;
      state.userAnswers = {};
      state.isFailedRetry = isFailedRetry;
      state.reviewFilter = "all";
      state.mobileQuizNavOpen = false;
      state.quizPhase = "active";
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function selectAnswer(letter) {
      if (state.view !== "quiz" || state.quizPhase !== "active") return;
      const currentQ = state.activeQuestions[state.currentIndex];
      if (!currentQ) return;

      // En Modo Estudio se bloquea tras responder para respetar la corrección inmediata
      if (state.mode === "study" && state.userAnswers[currentQ.id]) {
        return;
      }

      state.userAnswers[currentQ.id] = letter;
      render();
    }

    function goToQuestion(index) {
      if (index >= 0 && index < state.activeQuestions.length) {
        state.currentIndex = index;
        state.mobileQuizNavOpen = false;
        render();
        window.scrollTo({ top: 0, behavior: "smooth" });
      }
    }

    function nextQuestion() {
      if (state.currentIndex < state.activeQuestions.length - 1) {
        goToQuestion(state.currentIndex + 1);
      }
    }

    function prevQuestion() {
      if (state.currentIndex > 0) {
        goToQuestion(state.currentIndex - 1);
      }
    }

    function toggleMobileQuizNav() {
      state.mobileQuizNavOpen = !state.mobileQuizNavOpen;
      render();
    }

    function attemptFinishQuiz() {
      const total = state.activeQuestions.length;
      const answeredCount = Object.keys(state.userAnswers).length;
      const unanswered = total - answeredCount;

      if (unanswered > 0) {
        const label = unanswered === 1 ? "pregunta sin responder" : "preguntas sin responder";
        showConfirmModal({
          title: state.mode === "exam" ? "¿Entregar examen con preguntas sin responder?" : "¿Finalizar cuestionario?",
          message: `Todavía tienes ${unanswered} ${label}. Las preguntas en blanco contarán como no acertadas en la calificación final.`,
          confirmText: state.mode === "exam" ? "Entregar examen" : "Ver resultados",
          cancelText: "Seguir respondiendo",
          variant: "warning",
          onConfirm: () => {
            state.quizPhase = "results";
            render();
            window.scrollTo({ top: 0, behavior: "smooth" });
          }
        });
      } else {
        state.quizPhase = "results";
        render();
        window.scrollTo({ top: 0, behavior: "smooth" });
      }
    }

    function setReviewFilter(filter) {
      state.reviewFilter = filter;
      render();
    }

    function retryFailedQuestions() {
      const failedList = state.activeQuestions.filter((q) => state.userAnswers[q.id] !== q.correct);
      if (failedList.length > 0) {
        startActiveQuiz(failedList, true);
      }
    }

    function returnToQuizSetup() {
      state.quizPhase = "setup";
      state.userAnswers = {};
      state.isFailedRetry = false;
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    /**
     * ATAJOS DE TECLADO EN EL CUESTIONARIO ACTIVO
     */
    document.addEventListener("keydown", (e) => {
      const modal = document.getElementById("custom-modal");
      if (modal && !modal.classList.contains("hidden")) {
        if (e.key === "Escape") {
          modal.classList.add("hidden");
          modal.classList.remove("flex");
        }
        return;
      }

      if (state.view !== "quiz" || state.quizPhase !== "active") return;
      if (e.ctrlKey || e.metaKey || e.altKey) return;

      const key = e.key.toUpperCase();
      const mapKeys = {
        A: "A", "1": "A",
        B: "B", "2": "B",
        C: "C", "3": "C",
        D: "D", "4": "D"
      };

      if (mapKeys[key]) {
        e.preventDefault();
        selectAnswer(mapKeys[key]);
      } else if (e.key === "ArrowRight") {
        e.preventDefault();
        nextQuestion();
      } else if (e.key === "ArrowLeft") {
        e.preventDefault();
        prevQuestion();
      }
    });

                <path stroke-linecap="round" stroke-linejoin="round" d="M12 6.042A8.967 8.967 0 006 3.75c-1.052 0-2.062.18-3 .512v14.25A8.987 8.987 0 016 18c2.305 0 4.408.867 6 2.292m0-14.25a8.966 8.966 0 016-2.292c1.052 0 2.062.18 3 .512v14.25A8.987 8.987 0 0018 18a8.967 8.967 0 00-6 2.292m0-14.25v14.25" />
              </svg>
              <span>Cuestionario global</span>
            </button>
          </section>
        </main>

        ${renderFooter()}
      `;
    }

    /**
     * VISTA 3: PÁGINA DE CUESTIONARIO INTERACTIVO (SETUP, ACTIVO Y RESULTADOS)
     */
    function renderQuizSetupPhase(info) {
      const totalQuestions = info.questions.length;

      return `
        ${renderTopNavbar()}

        <main class="flex-1 max-w-3xl w-full mx-auto px-4 sm:px-6 py-8 sm:py-12 space-y-6 animate-fade-in">
          <!-- Breadcrumb para volver a la asignatura o a Inicio -->
          <div class="flex flex-wrap items-center justify-between gap-3">
            <button
              type="button"
              onclick="goSubject('${info.subject.id}')"
              class="inline-flex items-center gap-2 px-4 py-2 rounded-xl bg-white border border-slate-200 text-slate-700 hover:text-blue-600 hover:border-blue-300 text-sm font-semibold shadow-2xs transition cursor-pointer"
            >
              <span>← Volver a ${escapeHTML(info.subject.code)}</span>
            </button>

            <nav class="text-xs font-medium text-slate-500 flex items-center gap-2 flex-wrap" aria-label="Breadcrumb">
              <button type="button" onclick="goHome()" class="hover:text-blue-600 cursor-pointer">Inicio</button>
              <span>/</span>
              <button type="button" onclick="goSubject('${info.subject.id}')" class="hover:text-blue-600 cursor-pointer">${escapeHTML(info.subject.code)}</button>
              <span>/</span>
              <span class="font-bold text-slate-800">${state.quizKey === "global" ? "Cuestionario Global" : escapeHTML(state.quizKey.toUpperCase())}</span>
            </nav>
          </div>

          <!-- Tarjeta de configuración previa -->
          <div class="bg-white rounded-3xl shadow-sm border border-slate-200/90 overflow-hidden">
            <div class="bg-gradient-to-br from-blue-600 via-indigo-600 to-indigo-800 px-6 sm:px-10 py-8 sm:py-10 text-white">
              <div class="flex flex-wrap items-center gap-2 mb-3">
                <span class="px-3 py-1 rounded-full bg-white/15 border border-white/20 text-xs font-bold">
                  ${escapeHTML(info.subject.code)} · ${escapeHTML(info.subject.name)}
                </span>
                <span class="px-3 py-1 rounded-full bg-emerald-400/20 border border-emerald-300/30 text-emerald-100 text-xs font-bold">
                  ${totalQuestions} preguntas
                </span>
              </div>

              <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight leading-snug">
                ${escapeHTML(info.title)}
              </h1>
              <p class="mt-2 text-sm sm:text-base text-blue-100">
                Configura la modalidad de estudio antes de comenzar el cuestionario interactivo.
              </p>
            </div>

            <div class="p-6 sm:p-10 space-y-8">
              <div>
                <h2 class="text-xs font-bold uppercase tracking-wider text-slate-500 mb-4">
                  1. Selecciona la modalidad del cuestionario
                </h2>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                  <!-- Modo Estudio -->
                  <button
                    type="button"
                    onclick="selectQuizMode('study')"
                    class="text-left p-5 rounded-2xl border-2 transition-all cursor-pointer flex flex-col justify-between ${
                      state.mode === "study"
                        ? "border-blue-600 bg-blue-50/50 ring-1 ring-blue-600"
                        : "border-slate-200 bg-white hover:border-slate-300 hover:bg-slate-50"
                    }"
                  >
                    <div>
                      <div class="flex items-center justify-between gap-2 mb-3">
                        <span class="w-10 h-10 rounded-xl flex items-center justify-center ${
                          state.mode === "study" ? "bg-blue-600 text-white" : "bg-slate-100 text-slate-700"
                        }">
                          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M12 6.042A8.967 8.967 0 006 3.75c-1.052 0-2.062.18-3 .512v14.25A8.987 8.987 0 016 18c2.305 0 4.408.867 6 2.292m0-14.25a8.966 8.966 0 016-2.292c1.052 0 2.062.18 3 .512v14.25A8.987 8.987 0 0018 18a8.967 8.967 0 00-6 2.292m0-14.25v14.25" />
                          </svg>
                        </span>
                        <span class="w-5 h-5 rounded-full border-2 flex items-center justify-center ${
                          state.mode === "study" ? "border-blue-600" : "border-slate-300"
                        }">
                          ${state.mode === "study" ? '<span class="w-2.5 h-2.5 rounded-full bg-blue-600"></span>' : ""}
                        </span>
                      </div>
                      <h3 class="font-bold text-slate-900 text-base">
                        Modo Estudio
                      </h3>
                      <p class="mt-1.5 text-sm text-slate-600 leading-relaxed">
                        Corrección y justificación explicativa inmediata tras responder cada pregunta.
                      </p>
                    </div>
                  </button>

                  <!-- Modo Examen -->
                  <button
                    type="button"
                    onclick="selectQuizMode('exam')"
                    class="text-left p-5 rounded-2xl border-2 transition-all cursor-pointer flex flex-col justify-between ${
                      state.mode === "exam"
                        ? "border-indigo-600 bg-indigo-50/50 ring-1 ring-indigo-600"
                        : "border-slate-200 bg-white hover:border-slate-300 hover:bg-slate-50"
                    }"
                  >
                    <div>
                      <div class="flex items-center justify-between gap-2 mb-3">
                        <span class="w-10 h-10 rounded-xl flex items-center justify-center ${
                          state.mode === "exam" ? "bg-indigo-600 text-white" : "bg-slate-100 text-slate-700"
                        }">
                          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M9 12h3.75M9 15h3.75M9 18h3.75m3 .75H18a2.25 2.25 0 002.25-2.25V6.108c0-1.135-.845-2.098-1.976-2.192a48.424 48.424 0 00-1.123-.08m-5.801 0c-.065.21-.1.433-.1.664 0 .414.336.75.75.75h4.5a.75.75 0 00.75-.75 2.25 2.25 0 00-.1-.664m-5.8 0A2.251 2.251 0 0113.5 2.25H15c1.012 0 1.867.668 2.15 1.586m-5.8 0c-.376.023-.75.05-1.124.08C9.095 4.01 8.25 4.973 8.25 6.108V8.25m0 0H4.875c-.621 0-1.125.504-1.125 1.125v11.25c0 .621.504 1.125 1.125 1.125h9.75c.621 0 1.125-.504 1.125-1.125V9.375c0-.621-.504-1.125-1.125-1.125H8.25z" />
                          </svg>
                        </span>
                        <span class="w-5 h-5 rounded-full border-2 flex items-center justify-center ${
                          state.mode === "exam" ? "border-indigo-600" : "border-slate-300"
                        }">
                          ${state.mode === "exam" ? '<span class="w-2.5 h-2.5 rounded-full bg-indigo-600"></span>' : ""}
                        </span>
                      </div>
                      <h3 class="font-bold text-slate-900 text-base">
                        Modo Examen
                      </h3>
                      <p class="mt-1.5 text-sm text-slate-600 leading-relaxed">
                        Navega libremente entre todas las preguntas y obtén la corrección completa al finalizar el test.
                      </p>
                    </div>
                  </button>
                </div>
              </div>

              <!-- Casilla opcional: Barajar orden de las preguntas -->
              <div class="pt-2 border-t border-slate-100">
                <label class="inline-flex items-center gap-3 p-3 rounded-xl hover:bg-slate-50 transition cursor-pointer select-none">
                  <input
                    type="checkbox"
                    ${state.shuffle ? "checked" : ""}
                    onchange="toggleQuizShuffle(this.checked)"
                    class="w-5 h-5 rounded-md border-slate-300 text-blue-600 focus:ring-blue-500 cursor-pointer"
                  />
                  <div>
                    <span class="text-sm font-semibold text-slate-800 block">Barajar orden de las preguntas</span>
                    <span class="text-xs text-slate-500">Desactivada por defecto para mantener el orden secuencial del cuestionario.</span>
                  </div>
                </label>
              </div>

              <!-- Botón Comenzar cuestionario -->
              <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 pt-2">
                <div class="text-xs text-slate-500 flex items-center gap-1.5 flex-wrap">
                  <span class="px-2 py-1 rounded-md bg-slate-100 border border-slate-200 font-mono text-slate-700">A-D</span>
                  <span>o</span>
                  <span class="px-2 py-1 rounded-md bg-slate-100 border border-slate-200 font-mono text-slate-700">1-4</span>
                  <span>responder ·</span>
                  <span class="px-2 py-1 rounded-md bg-slate-100 border border-slate-200 font-mono text-slate-700">← →</span>
                  <span>navegar</span>
                </div>

                <button
                  type="button"
                  onclick="startActiveQuiz()"
                  class="w-full sm:w-auto inline-flex items-center justify-center gap-2.5 px-7 py-3.5 rounded-2xl bg-blue-600 hover:bg-blue-700 active:scale-[0.99] text-white font-bold text-base shadow-sm transition cursor-pointer"
                >
                  <span>Comenzar cuestionario</span>
                  <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5L21 12m0 0l-7.5 7.5M21 12H3" />
                  </svg>
                </button>
              </div>
            </div>
          </div>
        </main>

        ${renderFooter()}
      `;
    }

    function renderQuizActivePhase(info) {
      const total = state.activeQuestions.length;
      const currentQ = state.activeQuestions[state.currentIndex];
      const userChoice = state.userAnswers[currentQ.id];
      const isAnswered = Boolean(userChoice);
      const isStudy = state.mode === "study";
      const showFeedback = isStudy && isAnswered;
      const answeredCount = Object.keys(state.userAnswers).length;
      const progressPercent = Math.round(((state.currentIndex + 1) / total) * 100);
      const isLast = state.currentIndex === total - 1;

      const optionsHtml = ["A", "B", "C", "D"].map((letter) => {
        const optionText = currentQ.options[letter];
        const isSelected = userChoice === letter;
        const isCorrectOption = currentQ.correct === letter;

        let containerClasses = "border-slate-200 bg-white hover:border-blue-400 hover:bg-blue-50/30 text-slate-800";
        let badgeClasses = "bg-slate-100 text-slate-700 border-slate-200";
        let statusIcon = "";

        if (showFeedback) {
          if (isCorrectOption) {
            containerClasses = "border-emerald-500 bg-emerald-50/90 text-emerald-950 ring-1 ring-emerald-500";
            badgeClasses = "bg-emerald-600 text-white border-emerald-600";
            statusIcon = `
              <span class="shrink-0 w-6 h-6 rounded-full bg-emerald-600 text-white flex items-center justify-center">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5" />
                </svg>
              </span>
            `;
          } else if (isSelected && !isCorrectOption) {
            containerClasses = "border-rose-500 bg-rose-50/90 text-rose-950 ring-1 ring-rose-500";
            badgeClasses = "bg-rose-600 text-white border-rose-600";
            statusIcon = `
              <span class="shrink-0 w-6 h-6 rounded-full bg-rose-600 text-white flex items-center justify-center">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                </svg>
              </span>
            `;
          } else {
            containerClasses = "border-slate-200/80 bg-slate-50/60 text-slate-500 opacity-75";
            badgeClasses = "bg-slate-100 text-slate-400 border-slate-200";
          }
        } else if (isSelected) {
          containerClasses = "border-blue-600 bg-blue-50/70 text-slate-950 ring-1 ring-blue-600";
          badgeClasses = "bg-blue-600 text-white border-blue-600";
          statusIcon = `
            <span class="shrink-0 w-6 h-6 rounded-full bg-blue-600 text-white flex items-center justify-center">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5" />
              </svg>
            </span>
          `;
        }

        const disabledAttr = showFeedback ? "disabled" : "";
        const cursorClass = showFeedback ? "cursor-default" : "cursor-pointer active:scale-[0.995]";

        return `
          <button
            type="button"
            ${disabledAttr}
            onclick="selectAnswer('${letter}')"
            class="w-full text-left p-4 sm:p-5 rounded-2xl border-2 transition-all flex items-start gap-3.5 sm:gap-4 ${containerClasses} ${cursorClass}"
          >
            <span class="w-8 h-8 sm:w-9 sm:h-9 rounded-xl border font-bold text-sm flex items-center justify-center shrink-0 mt-0.5 transition-colors ${badgeClasses}">
              ${letter}
            </span>
            <span class="flex-1 text-sm sm:text-base leading-relaxed font-medium pt-0.5">
              ${escapeHTML(optionText)}
            </span>
            ${statusIcon}
          </button>
        `;
      }).join("");

      let feedbackBlockHtml = "";
      if (showFeedback) {
        const isCorrect = userChoice === currentQ.correct;
        feedbackBlockHtml = `
          <div class="mt-6 p-5 rounded-2xl border animate-fade-in ${
            isCorrect
              ? "bg-emerald-50/90 border-emerald-200 text-emerald-950"
              : "bg-rose-50/90 border-rose-200 text-rose-950"
          }">
            <div class="flex items-center gap-2.5 font-bold text-sm sm:text-base ${
              isCorrect ? "text-emerald-800" : "text-rose-800"
            }">
              ${
                isCorrect
                  ? `<svg class="w-5 h-5 text-emerald-600 shrink-0" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                     <span>¡Respuesta correcta!</span>`
                  : `<svg class="w-5 h-5 text-rose-600 shrink-0" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9.75 9.75l4.5 4.5m0-4.5l-4.5 4.5M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                     <span>Respuesta incorrecta. La opción correcta es la ${currentQ.correct}.</span>`
              }
            </div>
            <div class="mt-2.5 pt-2.5 border-t ${isCorrect ? "border-emerald-200/80" : "border-rose-200/80"} text-sm leading-relaxed ${
              isCorrect ? "text-emerald-900" : "text-rose-900"
            }">
              <span class="font-semibold">Justificación:</span> ${escapeHTML(currentQ.justification)}
            </div>
          </div>
        `;
      }

      const mapButtonsHtml = state.activeQuestions.map((q, idx) => {
        const ans = state.userAnswers[q.id];
        const isCurrent = idx === state.currentIndex;
        let btnClass = "bg-white text-slate-700 border-slate-200 hover:border-blue-400";

        if (ans) {
          if (isStudy) {
            btnClass =
              ans === q.correct
                ? "bg-emerald-600 text-white border-emerald-600 hover:bg-emerald-700"
                : "bg-rose-600 text-white border-rose-600 hover:bg-rose-700";
          } else {
            btnClass = "bg-blue-600 text-white border-blue-600 hover:bg-blue-700";
          }
        }

        const currentRing = isCurrent ? "ring-2 ring-offset-2 ring-indigo-600 font-extrabold" : "font-semibold";

        return `
          <button
            type="button"
            onclick="goToQuestion(${idx})"
            title="Ir a la pregunta ${idx + 1}"
            class="h-10 rounded-xl border text-xs sm:text-sm transition flex items-center justify-center cursor-pointer ${btnClass} ${currentRing}"
          >
            ${idx + 1}
          </button>
        `;
      }).join("");

      const legendHtml = isStudy
        ? `
          <div class="mt-4 pt-4 border-t border-slate-100 grid grid-cols-2 gap-2 text-xs text-slate-600">
            <div class="flex items-center gap-2"><span class="w-3.5 h-3.5 rounded-sm bg-white border border-slate-300"></span><span>Pendiente</span></div>
            <div class="flex items-center gap-2"><span class="w-3.5 h-3.5 rounded-sm bg-emerald-600"></span><span>Acertada</span></div>
            <div class="flex items-center gap-2"><span class="w-3.5 h-3.5 rounded-sm bg-rose-600"></span><span>Fallada</span></div>
            <div class="flex items-center gap-2"><span class="w-3.5 h-3.5 rounded-sm border-2 border-indigo-600"></span><span>Actual</span></div>
          </div>
        `
        : `
          <div class="mt-4 pt-4 border-t border-slate-100 grid grid-cols-2 gap-2 text-xs text-slate-600">
            <div class="flex items-center gap-2"><span class="w-3.5 h-3.5 rounded-sm bg-white border border-slate-300"></span><span>Pendiente</span></div>
            <div class="flex items-center gap-2"><span class="w-3.5 h-3.5 rounded-sm bg-blue-600"></span><span>Respondida</span></div>
            <div class="flex items-center gap-2 col-span-2"><span class="w-3.5 h-3.5 rounded-sm border-2 border-indigo-600"></span><span>Pregunta actual</span></div>
          </div>
        `;

      return `
        ${renderTopNavbar()}

        <!-- Subbarra de progreso del cuestionario -->
        <div class="bg-white border-b border-slate-200/90 sticky top-16 z-30 shadow-2xs">
          <div class="max-w-6xl mx-auto px-4 sm:px-6 py-3 flex flex-wrap items-center justify-between gap-3">
            <div class="flex items-center gap-2.5 min-w-0">
              <button
                type="button"
                onclick="goSubject('${info.subject.id}')"
                class="px-3 py-1.5 rounded-xl bg-slate-100 hover:bg-slate-200/80 text-slate-700 text-xs font-semibold transition shrink-0 cursor-pointer"
              >
                ← ${escapeHTML(info.subject.code)}
              </button>
              <div class="min-w-0">
                <p class="text-xs sm:text-sm font-bold text-slate-900 truncate">
                  ${escapeHTML(info.title)}
                </p>
                <p class="text-[11px] text-slate-500">
                  ${isStudy ? "Modo Estudio (corrección inmediata)" : "Modo Examen (corrección al final)"}
                  ${state.isFailedRetry ? " · Repaso de falladas" : ""}
                </p>
              </div>
            </div>

            <div class="flex items-center gap-2 shrink-0">
              <button
                type="button"
                onclick="toggleMobileQuizNav()"
                class="lg:hidden inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold transition cursor-pointer"
              >
                <span>Mapa (${answeredCount}/${total})</span>
              </button>

              <button
                type="button"
                onclick="attemptFinishQuiz()"
                class="inline-flex items-center gap-1.5 px-4 py-1.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold shadow-2xs transition cursor-pointer"
              >
                <span>${isStudy ? "Ver resultados" : "Finalizar examen"}</span>
              </button>
            </div>
          </div>

          <!-- Barra visual de progreso -->
          <div class="w-full bg-slate-100 h-1.5">
            <div class="bg-gradient-to-r from-blue-600 to-indigo-600 h-1.5 transition-all duration-300" style="width: ${progressPercent}%"></div>
          </div>

          ${
            state.mobileQuizNavOpen
              ? `
              <div class="lg:hidden bg-white border-t border-slate-200 px-4 py-4 shadow-md animate-fade-in">
                <div class="flex items-center justify-between mb-3">
                  <span class="text-xs font-bold uppercase tracking-wider text-slate-500">Mapa de preguntas</span>
                  <button type="button" onclick="toggleMobileQuizNav()" class="text-xs font-semibold text-slate-600">Cerrar ✕</button>
                </div>
                <div class="grid grid-cols-5 sm:grid-cols-10 gap-2">
                  ${mapButtonsHtml}
                </div>
                ${legendHtml}
              </div>
            `
              : ""
          }
        </div>

        <!-- Cuerpo del cuestionario -->
        <main class="flex-1 max-w-6xl w-full mx-auto px-4 sm:px-6 py-6 sm:py-8">
          <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
            <!-- Columna izquierda: Tarjeta de pregunta -->
            <div class="lg:col-span-8 space-y-5">
              <div class="bg-white rounded-3xl shadow-sm border border-slate-200/90 p-5 sm:p-8 animate-fade-in">
                <div class="flex flex-wrap items-center justify-between gap-2 pb-4 mb-5 border-b border-slate-100">
                  <div class="flex items-center gap-2 flex-wrap">
                    <span class="inline-flex items-center px-3 py-1 rounded-xl bg-blue-600 text-white text-xs sm:text-sm font-bold">
                      Pregunta ${state.currentIndex + 1} de ${total}
                    </span>
                    ${
                      currentQ.themeLabel
                        ? `<span class="text-xs font-semibold text-indigo-700 bg-indigo-50 px-2.5 py-1 rounded-lg border border-indigo-100">${escapeHTML(currentQ.themeLabel)}</span>`
                        : ""
                    }
                  </div>
                  <span class="text-xs font-medium text-slate-500">
                    Respondidas: <strong class="text-slate-900">${answeredCount}</strong> / ${total}
                  </span>
                </div>

                <h2 class="text-lg sm:text-xl font-bold text-slate-900 leading-relaxed mb-6">
                  ${escapeHTML(currentQ.question)}
                </h2>

                <div class="space-y-3" role="radiogroup" aria-label="Opciones de respuesta">
                  ${optionsHtml}
                </div>

                ${feedbackBlockHtml}
              </div>

              <!-- Navegación Anterior / Siguiente -->
              <div class="flex items-center justify-between gap-3 pt-1">
                <button
                  type="button"
                  onclick="prevQuestion()"
                  ${state.currentIndex === 0 ? "disabled" : ""}
                  class="inline-flex items-center justify-center gap-2 px-5 py-3 rounded-2xl border font-semibold text-sm transition ${
                    state.currentIndex === 0
                      ? "border-slate-200 bg-slate-100 text-slate-400 cursor-not-allowed"
                      : "border-slate-300 bg-white text-slate-800 hover:bg-slate-50 cursor-pointer"
                  }"
                >
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5L8.25 12l7.5-7.5" />
                  </svg>
                  <span>Anterior</span>
                </button>

                ${
                  isLast
                    ? `
                    <button
                      type="button"
                      onclick="attemptFinishQuiz()"
                      class="inline-flex items-center justify-center gap-2 px-6 py-3 rounded-2xl bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-sm shadow-xs transition cursor-pointer"
                    >
                      <span>${isStudy ? "Finalizar y ver resultados" : "Finalizar examen"}</span>
                      <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5" />
                      </svg>
                    </button>
                  `
                    : `
                    <button
                      type="button"
                      onclick="nextQuestion()"
                      class="inline-flex items-center justify-center gap-2 px-6 py-3 rounded-2xl bg-blue-600 hover:bg-blue-700 text-white font-semibold text-sm shadow-xs transition cursor-pointer"
                    >
                      <span>Siguiente</span>
                      <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5" />
                      </svg>
                    </button>
                  `
                }
              </div>
            </div>

            <!-- Columna derecha: Mapa lateral de preguntas en escritorio -->
            <aside class="hidden lg:block lg:col-span-4 sticky top-36">
              <div class="bg-white rounded-3xl shadow-sm border border-slate-200/90 p-6">
                <div class="flex items-center justify-between mb-4">
                  <h3 class="text-sm font-bold text-slate-900">Mapa de preguntas</h3>
                  <span class="text-xs font-semibold px-2.5 py-1 rounded-lg bg-blue-50 text-blue-700">
                    ${answeredCount} / ${total}
                  </span>
                </div>

                <div class="grid grid-cols-5 gap-2">
                  ${mapButtonsHtml}
                </div>

                ${legendHtml}

                <div class="mt-5 pt-4 border-t border-slate-100">
                  <button
                    type="button"
                    onclick="attemptFinishQuiz()"
                    class="w-full py-3 px-4 rounded-2xl bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-sm transition cursor-pointer"
                  >
                    ${isStudy ? "Finalizar estudio" : "Finalizar examen"}
                  </button>
                </div>
              </div>
            </aside>
          </div>
        </main>

        ${renderFooter()}
      `;
    }

    function renderQuizResultsPhase(info) {
      const total = state.activeQuestions.length;
      let correctCount = 0;
      let failedCount = 0;
      let unansweredCount = 0;

      state.activeQuestions.forEach((q) => {
        const ans = state.userAnswers[q.id];
        if (!ans) {
          unansweredCount++;
        } else if (ans === q.correct) {
          correctCount++;
        } else {
          failedCount++;
        }
      });

      const notCorrectCount = failedCount + unansweredCount;
      const percentage = Math.round((correctCount / total) * 100);
      const gradeOver10 = ((correctCount / total) * 10).toFixed(2).replace(".", ",");

      const filteredQuestions = state.activeQuestions.filter((q) => {
        if (state.reviewFilter === "failed") {
          return state.userAnswers[q.id] !== q.correct;
        }
        return true;
      });

      const reviewCardsHtml =
        filteredQuestions.length === 0
          ? `
          <div class="bg-white rounded-3xl border border-slate-200 p-8 text-center">
            <div class="w-12 h-12 rounded-2xl bg-emerald-100 text-emerald-700 flex items-center justify-center mx-auto mb-3">
              <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5" />
              </svg>
            </div>
            <h3 class="text-base font-bold text-slate-900">¡Excelente resultado!</h3>
            <p class="mt-1 text-sm text-slate-600">No has fallado ninguna pregunta en esta sesión.</p>
          </div>
        `
          : filteredQuestions
              .map((q) => {
                const pos = state.activeQuestions.findIndex((item) => item.id === q.id) + 1;
                const userAns = state.userAnswers[q.id];
                const isCorrect = userAns === q.correct;
                const isUnanswered = !userAns;

                const statusBadge = isCorrect
                  ? `<span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-bold bg-emerald-100 text-emerald-800">✓ Correcta</span>`
                  : isUnanswered
                  ? `<span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-bold bg-amber-100 text-amber-800">Sin responder</span>`
                  : `<span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-bold bg-rose-100 text-rose-800">✕ Incorrecta</span>`;

                const optionsHtml = ["A", "B", "C", "D"]
                  .map((letter) => {
                    const isUserChoice = userAns === letter;
                    const isRight = q.correct === letter;

                    let rowClass = "border-slate-200 bg-slate-50/50 text-slate-700";
                    let badgeClass = "bg-white border-slate-200 text-slate-600";
                    let tagHtml = "";

                    if (isRight && isUserChoice) {
                      rowClass = "border-emerald-400 bg-emerald-50/90 text-emerald-950 font-medium";
                      badgeClass = "bg-emerald-600 border-emerald-600 text-white";
                      tagHtml = `<span class="ml-auto shrink-0 text-[11px] font-bold uppercase px-2 py-0.5 rounded-md bg-emerald-200/80 text-emerald-900">Tu respuesta · Correcta</span>`;
                    } else if (isRight) {
                      rowClass = "border-emerald-400 bg-emerald-50/90 text-emerald-950 font-medium";
                      badgeClass = "bg-emerald-600 border-emerald-600 text-white";
                      tagHtml = `<span class="ml-auto shrink-0 text-[11px] font-bold uppercase px-2 py-0.5 rounded-md bg-emerald-200/80 text-emerald-900">Correcta</span>`;
                    } else if (isUserChoice) {
                      rowClass = "border-rose-400 bg-rose-50/90 text-rose-950 font-medium";
                      badgeClass = "bg-rose-600 border-rose-600 text-white";
                      tagHtml = `<span class="ml-auto shrink-0 text-[11px] font-bold uppercase px-2 py-0.5 rounded-md bg-rose-200/80 text-rose-900">Tu respuesta</span>`;
                    }

                    return `
                    <div class="p-3.5 rounded-xl border flex items-start gap-3 text-sm ${rowClass}">
                      <span class="w-7 h-7 rounded-lg border font-bold text-xs flex items-center justify-center shrink-0 mt-0.5 ${badgeClass}">
                        ${letter}
                      </span>
                      <span class="flex-1 leading-relaxed pt-0.5">${escapeHTML(q.options[letter])}</span>
                      ${tagHtml}
                    </div>
                  `;
                  })
                  .join("");

                return `
                <article class="bg-white rounded-3xl shadow-2xs border ${
                  isCorrect ? "border-slate-200" : "border-rose-200"
                } p-5 sm:p-7">
                  <div class="flex flex-wrap items-center justify-between gap-2 mb-3">
                    <div class="flex items-center gap-2">
                      <span class="text-xs font-extrabold uppercase tracking-wider text-slate-500">
                        Pregunta ${pos}
                      </span>
                      ${
                        q.themeLabel
                          ? `<span class="text-xs font-semibold text-indigo-700 bg-indigo-50 px-2 py-0.5 rounded-md">${escapeHTML(q.themeLabel)}</span>`
                          : ""
                      }
                    </div>
                    ${statusBadge}
                  </div>

                  <h3 class="text-base sm:text-lg font-bold text-slate-900 leading-relaxed mb-4">
                    ${escapeHTML(q.question)}
                  </h3>

                  <div class="space-y-2.5 mb-4">
                    ${optionsHtml}
                  </div>

                  <div class="p-4 rounded-2xl bg-blue-50/70 border border-blue-200/80 text-sm text-slate-800 leading-relaxed">
                    <span class="font-bold text-blue-900">Justificación:</span> ${escapeHTML(q.justification)}
                  </div>
                </article>
              `;
              })
              .join("");

      return `
        ${renderTopNavbar()}

        <main class="flex-1 max-w-4xl w-full mx-auto px-4 sm:px-6 py-8 sm:py-10 space-y-8 animate-fade-in">
          <!-- Breadcrumb -->
          <div class="flex flex-wrap items-center justify-between gap-3">
            <button
              type="button"
              onclick="goSubject('${info.subject.id}')"
              class="inline-flex items-center gap-2 px-4 py-2 rounded-xl bg-white border border-slate-200 text-slate-700 hover:text-blue-600 hover:border-blue-300 text-sm font-semibold shadow-2xs transition cursor-pointer"
            >
              <span>← Volver a ${escapeHTML(info.subject.code)}</span>
            </button>

            <nav class="text-xs font-medium text-slate-500 flex items-center gap-2">
              <button type="button" onclick="goHome()" class="hover:text-blue-600 cursor-pointer">Inicio</button>
              <span>/</span>
              <button type="button" onclick="goSubject('${info.subject.id}')" class="hover:text-blue-600 cursor-pointer">${escapeHTML(info.subject.code)}</button>
              <span>/</span>
              <span class="font-bold text-slate-800">Resultados</span>
            </nav>
          </div>

          <!-- Tarjeta de calificación global -->
          <section class="bg-white rounded-3xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="bg-gradient-to-br from-blue-600 via-indigo-600 to-indigo-800 p-6 sm:p-8 text-white">
              <p class="text-xs font-bold uppercase tracking-wider text-blue-100">
                ${escapeHTML(info.subject.code)} · ${escapeHTML(info.title)} ${state.isFailedRetry ? "(Repaso de falladas)" : ""}
              </p>
              <h1 class="mt-1 text-2xl sm:text-3xl font-extrabold">
                Resumen de resultados
              </h1>

              <div class="mt-6 grid grid-cols-1 sm:grid-cols-3 gap-4">
                <div class="bg-white/15 border border-white/20 rounded-2xl p-4">
                  <span class="text-xs text-blue-100 block">Nota sobre 10</span>
                  <span class="text-2xl sm:text-3xl font-extrabold text-white mt-1 block">
                    ${gradeOver10} <span class="text-base font-medium text-blue-100">/ 10</span>
                  </span>
                </div>
                <div class="bg-white/15 border border-white/20 rounded-2xl p-4">
                  <span class="text-xs text-blue-100 block">Porcentaje de acierto</span>
                  <span class="text-2xl sm:text-3xl font-extrabold text-emerald-300 mt-1 block">
                    ${percentage} %
                  </span>
                </div>
                <div class="bg-white/15 border border-white/20 rounded-2xl p-4">
                  <span class="text-xs text-blue-100 block">Aciertos totales</span>
                  <span class="text-2xl sm:text-3xl font-extrabold text-white mt-1 block">
                    ${correctCount} <span class="text-base font-medium text-blue-100">/ ${total}</span>
                  </span>
                </div>
              </div>
            </div>

            <div class="p-6 sm:p-8">
              <div class="flex flex-wrap items-center gap-5 text-sm text-slate-600 pb-6 border-b border-slate-100">
                <span class="inline-flex items-center gap-2 font-medium">
                  <span class="w-3 h-3 rounded-full bg-emerald-500"></span>
                  Aciertos: <strong class="text-slate-900">${correctCount}</strong>
                </span>
                <span class="inline-flex items-center gap-2 font-medium">
                  <span class="w-3 h-3 rounded-full bg-rose-500"></span>
                  Fallos: <strong class="text-slate-900">${failedCount}</strong>
                </span>
                <span class="inline-flex items-center gap-2 font-medium">
                  <span class="w-3 h-3 rounded-full bg-amber-500"></span>
                  Sin responder: <strong class="text-slate-900">${unansweredCount}</strong>
                </span>
              </div>

              <div class="mt-6 flex flex-col sm:flex-row flex-wrap gap-3">
                ${
                  notCorrectCount > 0
                    ? `
                    <button
                      type="button"
                      onclick="retryFailedQuestions()"
                      class="inline-flex items-center justify-center gap-2 px-5 py-3 rounded-2xl bg-rose-600 hover:bg-rose-700 text-white font-bold text-sm transition cursor-pointer"
                    >
                      <span>Repasar solo las falladas (${notCorrectCount})</span>
                    </button>
                  `
                    : ""
                }

                <button
                  type="button"
                  onclick="returnToQuizSetup()"
                  class="inline-flex items-center justify-center gap-2 px-5 py-3 rounded-2xl bg-blue-600 hover:bg-blue-700 text-white font-bold text-sm transition cursor-pointer"
                >
                  <span>Repetir cuestionario</span>
                </button>

                <button
                  type="button"
                  onclick="goSubject('${info.subject.id}')"
                  class="inline-flex items-center justify-center gap-2 px-5 py-3 rounded-2xl border border-slate-300 bg-white hover:bg-slate-50 text-slate-700 font-semibold text-sm transition cursor-pointer"
                >
                  <span>Volver a la asignatura</span>
                </button>
              </div>
            </div>
          </section>

          <!-- Revisión detallada con filtros -->
          <section class="space-y-4">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
              <h2 class="text-lg font-extrabold text-slate-900">
                Revisión detallada de preguntas
              </h2>

              <div class="inline-flex p-1 rounded-2xl bg-slate-200/80 border border-slate-200 self-start">
                <button
                  type="button"
                  onclick="setReviewFilter('all')"
                  class="px-4 py-2 rounded-xl text-xs sm:text-sm font-bold transition cursor-pointer ${
                    state.reviewFilter === "all"
                      ? "bg-white text-blue-700 shadow-2xs"
                      : "text-slate-600 hover:text-slate-900"
                  }"
                >
                  Todas las preguntas (${total})
                </button>
                <button
                  type="button"
                  onclick="setReviewFilter('failed')"
                  class="px-4 py-2 rounded-xl text-xs sm:text-sm font-bold transition cursor-pointer ${
                    state.reviewFilter === "failed"
                      ? "bg-white text-rose-700 shadow-2xs"
                      : "text-slate-600 hover:text-slate-900"
                  }"
                >
                  Solo las falladas (${notCorrectCount})
                </button>
              </div>
            </div>

            <div class="space-y-4">
              ${reviewCardsHtml}
            </div>
          </section>
        </main>

        ${renderFooter()}
      `;
    }

    function renderQuizView() {
      const info = getQuizContextInfo();
      if (state.quizPhase === "setup") {
        return renderQuizSetupPhase(info);
      }
      if (state.quizPhase === "active") {
        return renderQuizActivePhase(info);
      }
      return renderQuizResultsPhase(info);
    }

    /**
     * RENDERIZADO PRINCIPAL DE LA APLICACIÓN
     */
    function render() {
      const app = document.getElementById("app");
      if (!app) return;

      if (state.view === "home") {
        app.innerHTML = renderHomeView();
      } else if (state.view === "subject") {
        app.innerHTML = renderSubjectView();
      } else if (state.view === "quiz") {
        app.innerHTML = renderQuizView();
      }
    }

    // Inicialización de ruta al cargar la página
    window.addEventListener("DOMContentLoaded", () => {
      if (!window.location.hash) {
        window.location.hash = "#/";
      }
      applyHashRoute(window.location.hash);
    });
  </script>
</body>
</html>
